# Guest code NOT translated: calls go to host `hle_*` implementations instead.

[libraries]
# Nintendo SDK + debugger/hardware libraries (see design doc, "3. SDK replacement").
override = [
    "gx.a", "vi.a", "pad.a", "si.a", "dvd.a", "card.a", "os.a", "ar.a", "exi.a", "ai.a",
    "dsp.a", "db.a", "hio.a", "base.a", "amcExi2.a", "amcnotstub.a", "OdemuExi2.a",
    "odenotstub.a", "TRK_MINNOW_DOLPHIN.a",
]

[functions]
# Per-function exceptions: guest symbol = "override" | "translate"
# Audio is stubbed for the headless boot (Plan 2): skip JAudio's start-up entirely.
Jac_Init = "override"
StartAudioThread = "override"
Jac_Start = "override"  # whole JAudio start-up; its allocator needs the audio thread
# Game-facing JAudio API (every JAudio function the game calls directly) is silent: no-op, returns 0.
Jac_AddDVDBuffer = "override"
Jac_BackDVDBuffer = "override"
Jac_CheckFreeEvents = "override"
Jac_CreateEvent = "override"
Jac_DemoFrame = "override"
Jac_DestroyEvent = "override"
Jac_EnterBossMode = "override"
Jac_ExitBossMode = "override"
Jac_FinishDemo = "override"
Jac_FinishPartsFindDemo = "override"
Jac_FinishTextDemo = "override"
Jac_Freeze = "override"
Jac_Freeze_Precall = "override"
Jac_GetActiveEvents = "override"
Jac_Gsync = "override"
Jac_InitAllEvent = "override"
Jac_Orima_Formation = "override"
Jac_Orima_Walk = "override"
Jac_OutputMode = "override"
Jac_Piki_Number = "override"
Jac_PlayEventAction = "override"
Jac_PlayOrimaSe = "override"
Jac_PlaySystemSe = "override"
Jac_SceneExit = "override"
Jac_SceneSetup = "override"
Jac_SetBGMVolume = "override"
Jac_SetDemoOnyons = "override"
Jac_SetDemoPartsCount = "override"
Jac_SetDemoPartsID = "override"
Jac_SetSEVolume = "override"
Jac_StartDemo = "override"
Jac_StartPartsFindDemo = "override"
