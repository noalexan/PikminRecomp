# Guest code NOT translated: calls go to host `hle_*` implementations instead.

[libraries]
# Nintendo SDK + debugger/hardware libraries (see design doc, "3. SDK replacement").
override = [
    "gx.a", "vi.a", "pad.a", "si.a", "dvd.a", "card.a", "os.a", "ar.a", "exi.a", "ai.a",
    "dsp.a", "db.a", "hio.a", "base.a", "amcExi2.a", "amcnotstub.a", "OdemuExi2.a",
    "odenotstub.a", "TRK_MINNOW_DOLPHIN.a",
]

[functions]
# Per-function exceptions: guest symbol = "override" | "translate"
# JAudio busy-waits on state that its audio/DVD threads or interrupts produce, with no OS call in
# the loop. On the GameCube an interrupt preempts such a loop; here "poll" makes the function's
# entry and loop heads scheduling points (ppc_poll). Found by grepping the decomp for empty loops.
Jac_InitEventSystem = "poll"                          # until the audio thread registers track 0x20000
Jac_HVQM_Init = "poll"                                # movie DVD load status, next DSP sync tick
Jac_HVQM_ForceStop = "poll"                           # movie DVD load
JV_LoadFile__FUlPUcUlUl = "poll"                      # DVD thread load status
DVDT_LoadFile__FPcPUc = "poll"                        # DVD thread load status
DVDT_LoadtoARAM_Main__FPv = "poll"                    # streaming buffer slots
Jaf_StopSeq__FUl = "poll"                             # sequence teardown by the audio thread
Jac_SceneSetup = "poll"                               # first_load / now_loading / boot-up BGM state
Jac_SceneExit = "poll"                                # now_loading
Jac_PlayBgm = "poll"                                  # sequence load state
Jac_PrepareDemoSound__FUl = "poll"                    # stream stop_ready
Jac_StartDemoSound__FUl = "poll"                      # stream stop_ready / start
Jac_StartDemo = "poll"                                # now_loading

# Enhancements (runtime/enhance/): "hook" = translated as f_<addr>_orig, all calls go to the host
# hle_<name>, which may call the original.
"waitRetrace__11DGXGraphicsFv" = "hook"
"updateSysClock__6SystemFv" = "hook"
"update__11CullFrustumFffff" = "hook"
"draw__9P2DScreenFiiPC14P2DGrafContext" = "hook"
"draw__7P2DPaneFiiPC14P2DGrafContextb" = "hook"
"draw__Q23zen12DrawGameInfoFR8Graphics" = "hook"
"control__10PcamCameraFR10Controller" = "hook"
"getCurrentAngle__10PcamCameraFv" = "hook"
"getCurrentHomingSpeed__10PcamCameraFv" = "hook"
"makePosture__10PcamCameraFv" = "hook"
"postrefresh__6MapMgrFR8Graphics" = "hook"
"grabBuffer__7TextureFiibb" = "hook"
"fillRectangle__11DGXGraphicsFR8RectArea" = "hook"
"drawRectangle__11DGXGraphicsFR8RectAreaR8RectAreaP8Vector3f" = "hook"
"projectWorldPoint__6CameraFR8GraphicsR8Vector3f" = "hook"
"update__15CinematicPlayerFv" = "hook"
